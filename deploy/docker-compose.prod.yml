# Production stack: Postgres, the API, and Caddy in front.
#
# On the server the images are pulled, never built (the free-tier VM is too small to build
# them): deploy.sh builds them on Cloud Build, pushes them to Artifact Registry, then runs
#   docker compose -f deploy/docker-compose.prod.yml --env-file /opt/football-ai/.env.prod pull
#   docker compose -f deploy/docker-compose.prod.yml --env-file /opt/football-ai/.env.prod up -d --no-build
# Locally, `docker compose ... build` builds them from the same Dockerfiles.
#
# Only Caddy publishes ports. The database and the API are reachable from the other
# containers and from nowhere else.
name: football-ai

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: football_ai
    # The data is a few MB; the defaults would reserve memory the 1 GB VM can't spare.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=4MB", "-c", "max_connections=40"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d football_ai"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  backend:
    image: ${REGISTRY:-football-ai}/backend:${TAG:-latest}
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION_STRING: postgresql://admin:${POSTGRES_PASSWORD}@db:5432/football_ai
      # A missing database must be loud, never a silent fall back to stale CSVs.
      ALLOW_CSV_FALLBACK: "false"
      RESTART_AFTER_ETL: "false"
      # Every start runs the ETL in the background (about 15 minutes on the 1 GB VM, which
      # has swap for it). A new container has none of the CSV artifacts the pipeline writes,
      # so this is what guarantees the data is current after every deploy; the 06:00 job
      # keeps it current after that.
      RUN_ETL_ON_STARTUP: ${RUN_ETL_ON_STARTUP:-false}
      TRUST_PROXY_HEADERS: "true"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      # Secrets (the assistant's model key, etc.) come from Secret Manager through the
      # VM's service account; nothing sensitive lives in this file.
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      FOOTBALL_AI_NODE: node
      # Prior-season caches, storylines history and saved tier lists live on a volume, so a
      # deploy no longer wipes them and the app does not re-download five seasons at every start.
      CACHE_DIR: /data/cache
    volumes:
      - appdata:/data/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health | grep -q '\"ready\":true'"]
      interval: 15s
      timeout: 6s
      retries: 40
      start_period: 60s
    logging: *logs

  web:
    image: ${REGISTRY:-football-ai}/web:${TAG:-latest}
    build:
      context: ../Dashboard/predictor-frontend
      dockerfile: ../../deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env.prod}
      DEFAULT_SNI: ${DEFAULT_SNI:?set DEFAULT_SNI in .env.prod}
      TLS_MODE: ${TLS_MODE:-internal}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set BASIC_AUTH_USER in .env.prod}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set BASIC_AUTH_HASH in .env.prod}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Caddyfile (a password) until Google sign-in is configured, then Caddyfile.oauth.
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logs

  # Google sign-in in front of everything. Only runs when COMPOSE_PROFILES=oauth, which
  # deploy/gcp/set-google-login.sh sets once the Google credentials exist.
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    profiles: ["oauth"]
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET:-}
      OAUTH2_PROXY_REDIRECT_URL: https://${DEFAULT_SNI:-localhost}/oauth2/callback
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      # Only the addresses in the file get in. A Google account that is not listed is refused
      # even though Google itself signed it in.
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    configs:
      - source: allowed_emails
        target: /etc/oauth2-proxy/allowed-emails.txt
    logging: *logs

configs:
  allowed_emails:
    content: "${ALLOWED_EMAIL:-nobody@invalid}"

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
